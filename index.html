<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zonkey キーマップ工房</title>
  <meta name="description" content="自作キーボード Zonkey（ZMK）のキーマップを日本語で編集・テストできるツール">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='6' width='28' height='20' rx='4' fill='%233b6fd8'/><rect x='6' y='10' width='5' height='5' rx='1' fill='white'/><rect x='13' y='10' width='5' height='5' rx='1' fill='white'/><rect x='20' y='10' width='5' height='5' rx='1' fill='white'/><rect x='8' y='17' width='16' height='5' rx='1' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⌨</span>
      <div>
        <h1>Zonkey キーマップ工房</h1>
        <div class="source" id="sourceInfo">読み込み中…</div>
      </div>
    </div>
    <div class="actions">
      <button id="deviceChip" class="device-chip hidden" title="本体の接続画面を開く"></button>
      <button id="btnUndo" title="元に戻す（Ctrl+Z）">↶ 元に戻す</button>
      <button id="btnRedo" title="やり直す（Ctrl+Y）">↷ やり直す</button>
      <button id="btnLoad">📂 読み込み</button>
      <button id="btnSave" class="primary">💾 保存</button>
      <label class="host" title="キーボードをつなぐ PC のキー配列。記号の表示とシミュレーション結果が変わります。">
        PC の配列
        <select id="hostSelect">
          <option value="jis">日本語（JIS）</option>
          <option value="us">英語（US）</option>
        </select>
      </label>
    </div>
  </header>

  <nav class="modes" role="tablist">
    <button role="tab" data-mode="edit" class="active">✏️ 編集</button>
    <button role="tab" data-mode="sim">🧪 シミュレーター</button>
    <button role="tab" data-mode="test">🔌 実機テスト</button>
    <button role="tab" data-mode="ball">🖲 トラックボール</button>
    <button role="tab" data-mode="device">🔗 本体に接続</button>
    <button role="tab" data-mode="code">📄 コードとチェック <span class="badge" id="lintBadge"></span></button>
  </nav>

  <main>
    <section class="board-area" id="boardArea">
      <div class="layer-tabs" id="layerTabs"></div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
      <div class="board-hint" id="boardHint"></div>
    </section>

    <section class="panel" id="panelEdit"></section>
    <section class="panel hidden" id="panelSim"></section>
    <section class="panel hidden" id="panelTest"></section>
    <section class="panel hidden" id="panelCode"></section>
    <section class="panel hidden" id="panelDevice"></section>
    <section class="panel hidden" id="panelBall"></section>
  </main>

  <dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
